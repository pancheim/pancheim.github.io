name: Actualizar inventario

on:
  schedule:
    - cron: "7,37 * * * *"   # cada 30 minutos; GitHub puede demorarlo unos minutos
  workflow_dispatch:          # boton "Run workflow" para actualizar a mano
  push:
    branches: [main]

permissions:
  contents: write   # para sumar cada guardado a la rama registro
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.diff.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
      # Registro completo de lo guardado: una linea por guardado en la rama registro.
      - uses: actions/checkout@v5
        with:
          ref: registro
          path: registro
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Bajar el mundo desde G-Portal
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_TLS: ${{ secrets.FTP_TLS }}
          FTP_WORLD_DIR: ${{ secrets.FTP_WORLD_DIR }}
        run: python arcon/fetch_ftp.py world
      - name: Cache de iconos
        uses: actions/cache@v4
        with:
          path: .icons
          key: iconos-${{ github.run_id }}
          restore-keys: iconos-
      # El historial compara con lo publicado: se baja antes de armar (si no existe, arranca vacio).
      - name: Armar la pagina
        env:
          # Clave del terreno cifrado (data/mapa_terreno.bin): sin ella la pestana Mapa sale sin terreno.
          MAP_KEY: ${{ secrets.MAP_KEY }}
        run: |
          mkdir -p prev
          curl -fsL '${{ steps.pages.outputs.base_url }}/inventario.json' -o prev/inventario.json || true
          curl -fsL '${{ steps.pages.outputs.base_url }}/historial.json' -o prev/historial.json || true
          PREV_DIR=prev REGISTRO=registro/registro.jsonl python arcon/build.py world site/index.html
      - name: Subir el registro
        working-directory: registro
        run: |
          if git diff --quiet; then echo "Registro sin cambios."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Guardado $(tail -n1 registro.jsonl | cut -c7-28)"
          git push -q
      # En las corridas programadas, si cofres, estaciones y plano son iguales a lo publicado,
      # no se republica (el servidor guarda aunque nadie juegue). A mano o al subir codigo, siempre.
      - name: Ver si cambio algo
        id: diff
        run: |
          nuevo=$(cat site/estado.txt)
          publicado=$(curl -fsL '${{ steps.pages.outputs.base_url }}/estado.txt' || true)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$nuevo" = "$publicado" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Sin cambios desde la ultima publicacion: no se republica."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.skip != 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
